    'Dominio y alojamiento incluidos el primer año',
    'Entrega en 10 días hábiles · 2 rondas de cambios'
  ]
};
function webPrecios(){
  const w=WEB_OFERTA;
  const conDesc=Math.round(w.precio*(1-w.descuento/100));
  return {full:w.precio,desc:conDesc,ahorro:w.precio-conDesc,
          fullRD:w.precio*w.tasa,descRD:conDesc*w.tasa};
}
function bloqueOferta(){
  const p=webPrecios();
  return `<div class="oferta">
    <div class="sello">${WEB_OFERTA.descuento}% MENOS</div>
    <h4>Página web profesional con tu plan anual</h4>
    <p>Contrata el sistema por un año y tu página web queda a mitad de precio.</p>
    <div class="precios">
      <span class="antes">US$ ${p.full}</span>
      <span class="ahora">US$ ${p.desc}</span>
      <span class="eq">≈ RD$ ${p.descRD.toLocaleString('es-DO')} · ahorras US$ ${p.ahorro}</span>
    </div>
    <ul>${WEB_OFERTA.incluye.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
  </div>`;
}

const PLANES=[
  {id:'mensual',   nombre:'Mensual',    meses:1,  precio:1500,  ahorro:0},
  {id:'trimestral',nombre:'Trimestral', meses:3,  precio:4050,  ahorro:10},
  {id:'anual',     nombre:'Anual',      meses:12, precio:14400, ahorro:20}
];
let SUSC=null; // {plan, vence, estado, dias}

async function cargarSuscripcion(){
  try{
    const {data}=await SB.from('suscripciones').select('*').eq('medico_id',SESION.medicoId||SESION.userId).maybeSingle();
    if(data){
      const dias=Math.ceil((new Date(data.vence+'T12:00:00')-new Date(hoyISO()+'T12:00:00'))/86400000);
      SUSC={plan:data.plan,vence:data.vence,estado:data.estado,dias};
    }
  }catch(e){SUSC=null}
}
function suscActiva(){
  if(SESION&&SESION.esAdmin)return true;
  if(!SUSC)return true; // si no se pudo leer, no bloquear al usuario
  return SUSC.estado==='activa'&&SUSC.dias>=0;
}
function bannerSuscripcion(){
  if(!SUSC||!esMedico()||(SESION&&SESION.esAdmin))return '';
  if(SUSC.estado!=='activa')return `<div class="sub-banner dang"><span>⚠ Tu cuenta está ${SUSC.estado}. Comunícate para reactivarla.</span></div>`;
  if(SUSC.dias<0)return '';
  const dLbl=SUSC.dias===0?'hoy':SUSC.dias===1?'mañana':`en ${SUSC.dias} días`;
  // Durante la prueba: siempre visible, en tono informativo
  if(SUSC.plan==='prueba'){
    const cls=SUSC.dias<=3?'dang':SUSC.dias<=7?'warn':'info';
    return `<div class="sub-banner ${cls}">
      <span>✨ Prueba gratuita — ${SUSC.dias===0?'último día':`te quedan ${SUSC.dias} día${SUSC.dias===1?'':'s'}`} (hasta el ${fmtFecha(SUSC.vence)})</span>
      <button class="btn sm" onclick="verPlanes()">Ver planes para continuar</button></div>`;
  }
  if(SUSC.dias<=7){
    return `<div class="sub-banner ${SUSC.dias<=3?'dang':'warn'}">
      <span>Tu suscripción vence ${dLbl} (${fmtFecha(SUSC.vence)})</span>
      <button class="btn sm" onclick="verPlanes()">Renovar</button></div>`;
  }
  return '';
}
function tarjetasPlanes(){
  return `<div class="planes">${PLANES.map(p=>`
    <div class="plan${p.id==='anual'?' destacado':''}">
      ${p.id==='anual'?'<div class="etq">2 MESES GRATIS</div>':''}
      <div class="pn">${p.nombre}</div>
      <div class="pp">${fmtMoney(p.precio)}</div>

      ${p.id==='anual'?`<span class="web-tag">+ Página web al ${WEB_OFERTA.descuento}%</span>`:''}
    </div>`).join('')}</div>`;
}

    <p style="font-size:13.5px;color:var(--muted)">${enPrueba

function adminRenovar(id,nombre){
  openModal(`<h3>Renovar suscripción</h3>
    <p style="font-size:13.5px;color:var(--muted);margin-bottom:12px">Cuenta: <b>${esc(nombre)}</b></p>

function arMonto(){
  const plan=document.getElementById('ar-plan').value;
  const p=PLANES.find(x=>x.id===plan);
  const box=document.getElementById('ar-web-box');
  const chk=document.getElementById('ar-web');
  if(box)box.style.display=plan==='anual'?'block':'none';
  if(plan!=='anual'&&chk)chk.checked=false;
  let total=p?p.precio:0;
  if(chk&&chk.checked)total+=webPrecios().descRD;
  document.getElementById('ar-monto').value=total;
}
async function confirmarRenovar(id){
  const plan=document.getElementById('ar-plan').value;
  const monto=Number(document.getElementById('ar-monto').value)||0;
  const chk=document.getElementById('ar-web');
  let nota=document.getElementById('ar-nota').value.trim();
  if(chk&&chk.checked)nota=(nota?nota+' · ':'')+'Incluye página web ('+WEB_OFERTA.descuento+'% desc.)';
  try{
    const {error}=await SB.rpc('admin_renovar',{p_medico:id,p_plan:plan,p_monto:monto,p_notas:nota});
    if(error)throw error;
    closeModal();toast('Suscripción actualizada');cargarAdmin();
  }catch(e){toast('Error: '+(e.message||e))}
}
async function adminEstado(id,estado){
  if(estado==='suspendida'&&!confirm('¿Suspender esta cuenta? El médico no podrá usar el sistema hasta reactivarla. Sus datos se conservan.'))return;
  try{
    const {error}=await SB.rpc('admin_estado',{p_medico:id,p_estado:estado});
    if(error)throw error;
    toast(estado==='activa'?'Cuenta reactivada':'Cuenta suspendida');cargarAdmin();
  }catch(e){toast('Error: '+(e.message||e))}
}

/* ---------- Atajos personales del médico ---------- */
function misAtajos(){
  if(!DB.config.atajos)DB.config.atajos={meds:[],plantillas:[],esquemas:[]};
  const a=DB.config.atajos;
  a.meds=a.meds||[];a.plantillas=a.plantillas||[];a.esquemas=a.esquemas||[];
  return a;
}
function todosLosMeds(){return misAtajos().meds.concat(VADEMECUM)}
function plantillasDe(campo){
  // campo: 'motivo' | 'examen' | 'plan'
  const propias=misAtajos().plantillas.filter(p=>p.campo===campo);
  const base=campo==='examen'?PLANTILLAS_EXAMEN:campo==='plan'?PLANTILLAS_PLAN:{};
  const out={};
  propias.forEach(p=>out['★ '+p.nombre]=p.texto);
  Object.keys(base).forEach(k=>out[k]=base[k]);
  return out;
}
let _PLT={};
function plantillaTxt(clave){return _PLT[clave]||''}

/* ---------- Motor de atajos ---------- */
function agregarTexto(id,txt,sep){
  const el=document.getElementById(id);if(!el)return;
  const v=el.value.trim();
  sep=sep||', ';
  el.value=v?(v.replace(/[.,;\s]+$/,'')+sep+txt.charAt(0).toLowerCase()+txt.slice(1)):txt;
  el.focus();el.dispatchEvent(new Event('input'));
}
function ponerTexto(id,txt){
  const el=document.getElementById(id);if(!el)return;
  const v=el.value.trim();
  el.value=v?v+'\n'+txt:txt;
  el.focus();
}
/* Panel de chips por categorías */
function panelChips(destino,grupos,etiqueta){
  const claves=Object.keys(grupos);
  const uid='ch'+Math.random().toString(36).slice(2,7);
  const tipo=(grupos===SIGNOS)?'signos':'sintomas';
  return `<div class="chips-box" id="${uid}" data-tipo="${tipo}">
    <div class="atajo-lbl">${etiqueta}</div>
    <div class="chips-tabs">${claves.map((k,i)=>
      `<button type="button" class="${i===0?'on':''}" onclick="cambiarChips('${uid}','${destino}',${i})">${esc(k)}</button>`).join('')}</div>
    <div class="chips" id="${uid}-lista">${grupos[claves[0]].map(t=>
      `<span class="chip" onclick="agregarTexto('${destino}','${esc(t).replace(/'/g,"\\'")}')">${esc(t)}</span>`).join('')}</div>
  </div>`;
}
const _GRUPOS={sintomas:SINTOMAS,signos:SIGNOS};
function cambiarChips(uid,destino,idx){
  const box=document.getElementById(uid);if(!box)return;
  const grupos=box.dataset.tipo==='signos'?SIGNOS:SINTOMAS;
  const claves=Object.keys(grupos);
  box.querySelectorAll('.chips-tabs button').forEach((b,i)=>b.classList.toggle('on',i===idx));
  document.getElementById(uid+'-lista').innerHTML=grupos[claves[idx]].map(t=>
    `<span class="chip" onclick="agregarTexto('${destino}','${esc(t).replace(/'/g,"\\'")}')">${esc(t)}</span>`).join('');
}
/* Plantillas de texto largo (propias ★ primero, luego las base) */
function panelPlantillas(destino,plantillas,etiqueta){
  Object.keys(plantillas).forEach(k=>{_PLT[destino+'|'+k]=plantillas[k]});
  return `<div class="chips-box"><div class="atajo-lbl">${etiqueta}</div>
    <div class="chips">${Object.keys(plantillas).map(k=>
      `<span class="chip plantilla" onclick="ponerTexto('${destino}',plantillaTxt('${destino}|${esc(k).replace(/'/g,"\\'")}'))">${esc(k)}</span>`).join('')}</div></div>`;
}
/* Autocompletado de medicamentos: rellena dosis y duración */
function autoMed(input){
  const fila=input.closest('[data-med-row]');if(!fila)return;
  const item=todosLosMeds().find(v=>v.m.toLowerCase()===input.value.trim().toLowerCase());
  const sug=fila.querySelector('.med-sug');
  if(item){
    const d=fila.querySelector('.fr-dosis'),u=fila.querySelector('.fr-dur');
    if(!d.value.trim())d.value=item.d;
    if(!u.value.trim())u.value=item.u;
    if(sug)sug.textContent='✓ '+item.g+' — dosis sugerida cargada, ajústala si es necesario';
  }else if(sug)sug.textContent='';
}
/* Autocompletado de diagnóstico: rellena el CIE-10 */
function autoDx(){
  const el=document.getElementById('fn-dx');if(!el)return;
  const item=DIAGNOSTICOS.find(x=>x.d.toLowerCase()===el.value.trim().toLowerCase());
  const cie=document.getElementById('fn-cie');
  if(item&&cie&&!cie.value.trim())cie.value=item.c;
}

function datalistMeds(){
  return `<datalist id="dl-meds">${todosLosMeds().map(v=>`<option value="${esc(v.m)}">${esc(v.g)}</option>`).join('')}</datalist>`;
}
function datalistDx(){
  return `<datalist id="dl-dx">${DIAGNOSTICOS.map(v=>`<option value="${esc(v.d)}">${esc(v.c)}</option>`).join('')}</datalist>`;
}



/* ---------- Vista: Mis atajos ---------- */
function vAtajos(){
  const a=misAtajos();
  return topbar('Mis atajos','Tus medicamentos, textos y esquemas de tratamiento','')+`
  <div class="info-strip">⚡ Todo lo que guardes aquí aparece automáticamente en tus recetas y notas de consulta, y se sincroniza con tu cuenta. Es tu forma de trabajar, pre-escrita.</div>
  <div class="grid grid-2" style="align-items:start">
    <div class="card"><h3>Mis esquemas de tratamiento <button class="btn sm" onclick="formEsquema()">+ Nuevo</button></h3>
      <p style="font-size:12.5px;color:var(--muted);margin-bottom:10px">Un esquema aplica varios medicamentos e indicaciones a la receta de un solo clic. También puedes crearlos desde una receta con "Guardar como esquema".</p>
      ${a.esquemas.length?a.esquemas.map((e,i)=>`
        <div style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:rgba(255,255,255,.6)">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
            <b>⚡ ${esc(e.nombre)}</b>
            <span style="white-space:nowrap"><button class="btn ghost sm" onclick="formEsquema(${i})">Editar</button>
            <button class="btn ghost sm" onclick="delAtajo('esquemas',${i})">✕</button></span></div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px">${e.items.map(it=>esc(it.med)).join(' · ')}</div>
        </div>`).join(''):'<div class="empty" style="padding:18px"><div class="big">⚡</div>Sin esquemas todavía</div>'}
    </div>
    <div>
      <div class="card" style="margin-bottom:16px"><h3>Mis medicamentos <button class="btn sm" onclick="formMedPropio()">+ Agregar</button></h3>
        <p style="font-size:12.5px;color:var(--muted);margin-bottom:10px">Fármacos que usas y no están en el vademécum base, con tu dosis habitual. Aparecen primero en el buscador de recetas.</p>
        ${a.meds.length?`<table><tbody>${a.meds.map((m,i)=>`
          <tr><td><b>${esc(m.m)}</b><br><span style="font-size:11.5px;color:var(--muted)">${esc(m.d)} — ${esc(m.u)}</span></td>
          <td style="white-space:nowrap;text-align:right"><button class="btn ghost sm" onclick="formMedPropio(${i})">Editar</button>
          <button class="btn ghost sm" onclick="delAtajo('meds',${i})">✕</button></td></tr>`).join('')}</tbody></table>`
        :'<div class="empty" style="padding:18px"><div class="big">💊</div>Sin medicamentos propios</div>'}
      </div>
      <div class="card"><h3>Mis plantillas de texto <button class="btn sm" onclick="formPlantillaPropia()">+ Nueva</button></h3>
        <p style="font-size:12.5px;color:var(--muted);margin-bottom:10px">Textos que repites en motivo, examen o plan. Aparecen con ★ al inicio de las plantillas.</p>
        ${a.plantillas.length?a.plantillas.map((p,i)=>`
          <div style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:rgba(255,255,255,.6)">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
              <span><b>★ ${esc(p.nombre)}</b> <span class="badge blue">${p.campo}</span></span>
              <span style="white-space:nowrap"><button class="btn ghost sm" onclick="formPlantillaPropia(${i})">Editar</button>
              <button class="btn ghost sm" onclick="delAtajo('plantillas',${i})">✕</button></span></div>
            <div style="font-size:12px;color:var(--muted);margin-top:4px">${esc(p.texto.slice(0,110))}${p.texto.length>110?'…':''}</div>

function delAtajo(tipo,i){
  if(!confirm('¿Eliminar este atajo?'))return;
  misAtajos()[tipo].splice(i,1);saveDB();render();
}
function formMedPropio(i){
  const m=i!=null?misAtajos().meds[i]:{};
  openModal(`<h3>${i!=null?'Editar':'Agregar'} medicamento propio</h3>
  <div class="form-grid">
    <div class="field full"><label>Medicamento y presentación *</label><input id="mp-m" value="${esc(m.m||'')}" placeholder="Vortioxetina 10 mg tabletas"></div>
    <div class="field"><label>Dosis / frecuencia habitual</label><input id="mp-d" value="${esc(m.d||'')}" placeholder="1 tableta cada 24 horas"></div>
    <div class="field"><label>Duración / cantidad habitual</label><input id="mp-u" value="${esc(m.u||'')}" placeholder="por 30 días · #30"></div>
  </div>
  <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button>
  <button class="btn" onclick="saveMedPropio(${i!=null?i:'null'})">Guardar</button></div>`);
}
function saveMedPropio(i){
  const m={g:'★ Mis medicamentos',m:$('#mp-m').value.trim(),d:$('#mp-d').value.trim(),u:$('#mp-u').value.trim()};
  if(!m.m){toast('El nombre es obligatorio');return}
  const a=misAtajos();
  if(i!=null)a.meds[i]=m;else a.meds.push(m);
  saveDB();closeModal();toast('Medicamento guardado');render();
}
function formPlantillaPropia(i){
  const p=i!=null?misAtajos().plantillas[i]:{};
  openModal(`<h3>${i!=null?'Editar':'Nueva'} plantilla de texto</h3>
  <div class="form-grid">
    <div class="field"><label>Nombre corto *</label><input id="pp-n" value="${esc(p.nombre||'')}" placeholder="Primera vez psiquiatría"></div>
    <div class="field"><label>Se usa en</label><select id="pp-c">
      ${[['motivo','Motivo de consulta'],['examen','Examen / hallazgos'],['plan','Plan de tratamiento']].map(([v,t])=>
        `<option value="${v}" ${p.campo===v?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="field full"><label>Texto *</label><textarea id="pp-t" rows="7">${esc(p.texto||'')}</textarea>
      <div class="hint">Puedes dejar espacios con ___ para rellenar en el momento.</div></div>
  </div>
  <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button>
  <button class="btn" onclick="savePlantillaPropia(${i!=null?i:'null'})">Guardar</button></div>`);
}
function savePlantillaPropia(i){
  const p={nombre:$('#pp-n').value.trim(),campo:$('#pp-c').value,texto:$('#pp-t').value.trim()};
  if(!p.nombre||!p.texto){toast('Nombre y texto son obligatorios');return}
  const a=misAtajos();
  if(i!=null)a.plantillas[i]=p;else a.plantillas.push(p);
  saveDB();closeModal();toast('Plantilla guardada');render();
}
function formEsquema(i){
  const e=i!=null?misAtajos().esquemas[i]:{items:[{}]};
  openModal(`<h3>${i!=null?'Editar':'Nuevo'} esquema de tratamiento</h3>
  <div class="field" style="margin-bottom:10px"><label>Nombre del esquema *</label>
    <input id="eq-n" value="${esc(e.nombre||'')}" placeholder="Depresión — inicio / IVU no complicada / HTA de novo"></div>
  ${datalistMeds()}
  <div id="eq-meds">${e.items.map((it,j)=>filaMedHTML(j,{med:it.med,dosis:it.dosis,dur:it.dur})).join('')}</div>
  <button class="btn secondary sm" onclick="addMedRowEq()">+ Agregar medicamento</button>
  <div class="field" style="margin-top:12px"><label>Indicaciones generales del esquema</label>
    <textarea id="eq-i">${esc(e.indicaciones||'')}</textarea></div>
  <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button>
  <button class="btn" onclick="saveEsquema(${i!=null?i:'null'})">Guardar esquema</button></div>`,true);
}
function addMedRowEq(){const box=document.getElementById('eq-meds');
  box.insertAdjacentHTML('beforeend',filaMedHTML(box.querySelectorAll('[data-med-row]').length))}
function saveEsquema(i){
  const nombre=$('#eq-n').value.trim();
  if(!nombre){toast('El nombre es obligatorio');return}
  const items=[...document.querySelectorAll('#eq-meds [data-med-row]')].map(r=>({
    med:r.querySelector('.fr-med').value.trim(),dosis:r.querySelector('.fr-dosis').value.trim(),dur:r.querySelector('.fr-dur').value.trim()
  })).filter(x=>x.med);
  if(!items.length){toast('Agrega al menos un medicamento');return}
  const e={nombre,items,indicaciones:$('#eq-i').value.trim()};
  const a=misAtajos();
  if(i!=null)a.esquemas[i]=e;else a.esquemas.push(e);
  logAction('Esquema personal guardado: '+nombre);
  saveDB();closeModal();toast('Esquema guardado');render();
}

(async function init(){
  if(SUPABASE_URL.includes('TU-PROYECTO')){
    document.querySelector('.auth-card').innerHTML='<h1>Med<span>Consulta</span></h1>'+
      '<div class="sub">Falta configurar la conexión</div>'+
      '<div class="auth-msg err" style="display:block">Abre este archivo con un editor de texto y reemplaza SUPABASE_URL y SUPABASE_ANON_KEY con los datos de tu proyecto (líneas al inicio del script). Están en Supabase → Settings → API.</div>';
    return;
  }
  if(!window.supabase){
    document.querySelector('.auth-card').innerHTML='<h1>Med<span>Consulta</span></h1>'+
      '<div class="sub">Problema de conexión</div>'+
      '<div class="auth-msg err" style="display:block">No se pudo cargar el componente de conexión. Revisa tu internet y recarga la página.</div>'+
      '<button class="btn" onclick="location.reload()">Reintentar</button>';

  }
  SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const {data:{session}}=await SB.auth.getSession();
  if(session)await entrar();
})();
</script>
<script>
/* Onda expansiva en cada clic */
document.addEventListener('click',function(e){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const r=document.createElement('span');
  r.className='ripple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';
  document.body.appendChild(r);
  setTimeout(()=>r.remove(),600);
},true);
</script>
<script>
/* Barra de progreso de lectura */
(function(){
  const bar=document.getElementById('scroll-progress');
  function upd(){
    const h=document.documentElement;
    const max=h.scrollHeight-h.clientHeight;
    bar.style.width=(max>0?(h.scrollTop/max*100):0)+'%';
  }
  window.addEventListener('scroll',upd,{passive:true});
  window.addEventListener('resize',upd);
})();

/* Contadores de KPIs que suben al aparecer */
function animarKPIs(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  document.querySelectorAll('.kpi .num').forEach(el=>{
    const txt=el.textContent;
    // Solo animar si es numérico puro o moneda (evita fechas y '—')
    const m=txt.match(/^([^0-9]*)([0-9][0-9.,]*)(.*)$/);
    if(!m)return;
    const fin=parseFloat(m[2].replace(/,/g,''));
    if(!isFinite(fin)||fin===0)return;
    const pre=m[1],post=m[3];
    const dec=/\.\d\d$/.test(m[2])?2:0;
    const dur=700,t0=performance.now();
    function paso(t){
      const p=Math.min((t-t0)/dur,1);
      const e=1-Math.pow(1-p,3); // ease-out
      el.textContent=pre+(fin*e).toLocaleString('es-DO',{minimumFractionDigits:dec,maximumFractionDigits:dec})+post;
      if(p<1)requestAnimationFrame(paso);else el.textContent=txt;
    }
    requestAnimationFrame(paso);
  });
}

/* Enganchar la transición de vista y los contadores al render existente */
if(typeof render==='function'){
  const renderOriginal=render;
  render=function(){
    renderOriginal();
    const m=document.getElementById('main');
    if(m){m.classList.remove('view-enter');void m.offsetWidth;m.classList.add('view-enter')}
    animarKPIs();
  };
}
</script>
